<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- White Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>
  
  <g transform="translate(256, 210)">
    <!-- 7 Colored Petals forming the ring (Outer R=165, Inner R=110) -->
    
    <!-- 1. Top: Purple (People/Community) -->
    <path d="M -46,-158 A 165,165 0 0,1 46,-158 L 31,-106 A 110,110 0 0,0 -31,-106 Z" fill="#5B21B6" rx="8"/>
    <!-- People Icon -->
    <circle cx="0" cy="-140" r="8" fill="#FFFFFF"/>
    <path d="M -12,-122 C -12,-130 12,-130 12,-122 Z" fill="#FFFFFF"/>
    <circle cx="-16" cy="-136" r="6" fill="#FFFFFF"/>
    <path d="M -25,-122 C -25,-128 -7,-128 -7,-122 Z" fill="#FFFFFF"/>
    <circle cx="16" cy="-136" r="6" fill="#FFFFFF"/>
    <path d="M 7,-122 C 7,-128 25,-128 25,-122 Z" fill="#FFFFFF"/>

    <!-- 2. Top-Right: Green (Leaf/Sprout) -->
    <path d="M 64,-152 A 165,165 0 0,1 138,-90 L 92,-60 A 110,110 0 0,0 43,-101 Z" fill="#15803D"/>
    <!-- Leaf Icon -->
    <g transform="translate(85, -100) rotate(25) scale(0.75)">
      <path d="M 0,15 C -20,5 -25,-25 0,-30 C 25,-25 20,5 0,15 Z" fill="#FFFFFF"/>
      <path d="M 12,-8 C 30,-5 35,-25 20,-30 C 5,-25 5,-10 12,-8 Z" fill="#FFFFFF"/>
    </g>

    <!-- 3. Right: Blue (Runner/Athletics) -->
    <path d="M 152,-64 A 165,165 0 0,1 162,35 L 108,23 A 110,110 0 0,0 101,-43 Z" fill="#1D4ED8"/>
    <!-- Runner Icon -->
    <g transform="translate(130, -12) scale(0.75)">
      <circle cx="2" cy="-20" r="5" fill="#FFFFFF"/>
      <path d="M -8,5 L -1,-2 L 4,-8 L 12,-5 M -1,-2 L -6,-12 L 6,-14 L 14,-10 M -6,-12 L -12,-8" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 4,-8 L 10,8 L 16,10 M -1,-2 L -10,8" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 4. Bottom-Right: Amber/Yellow (Music) -->
    <path d="M 152,55 A 165,165 0 0,1 92,138 L 61,92 A 110,110 0 0,0 101,37 Z" fill="#EAB308"/>
    <!-- Music Note -->
    <g transform="translate(102, 85) scale(0.8)">
      <circle cx="-8" cy="10" r="6" fill="#FFFFFF"/>
      <circle cx="8" cy="6" r="6" fill="#FFFFFF"/>
      <path d="M -2,10 L -2,-12 L 14,-16 L 14,6" stroke="#FFFFFF" stroke-width="3" fill="none"/>
      <polygon points="-2,-12 14,-16 14,-10 -2,-6" fill="#FFFFFF"/>
    </g>

    <!-- 5. Bottom-Left: Teal/Cyan (Code) -->
    <path d="M -92,138 A 165,165 0 0,1 -152,55 L -101,37 A 110,110 0 0,0 -61,92 Z" fill="#0891B2"/>
    <!-- Code Bracket </> -->
    <g transform="translate(-102, 85) scale(0.9)">
      <path d="M -8,8 L -15,0 L -8,-8" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 8,-8 L 15,0 L 8,8" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <path d="M 3,-10 L -3,10" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 6. Left: Crimson/Rose (Art Palette) -->
    <path d="M -162,35 A 165,165 0 0,1 -152,-64 L -101,-43 A 110,110 0 0,0 -108,23 Z" fill="#E11D48"/>
    <!-- Palette Icon -->
    <g transform="translate(-130, -12) scale(0.75)">
      <path d="M -14,-12 C -2,-24 20,-16 20,2 C 20,12 14,18 6,18 C 0,18 2,10 -4,10 C -8,10 -18,12 -18,-2 Z" fill="#FFFFFF"/>
      <circle cx="-6" cy="-8" r="2.5" fill="#E11D48"/>
      <circle cx="4" cy="-8" r="2.5" fill="#E11D48"/>
      <circle cx="10" cy="0" r="2.5" fill="#E11D48"/>
      <circle cx="4" cy="8" r="2" fill="#E11D48"/>
    </g>

    <!-- 7. Top-Left: Orange (Lightbulb) -->
    <path d="M -138,-90 A 165,165 0 0,1 -64,-152 L -43,-101 A 110,110 0 0,0 -92,-60 Z" fill="#EA580C"/>
    <!-- Lightbulb Icon -->
    <g transform="translate(-85, -100) scale(0.75)">
      <circle cx="0" cy="-8" r="11" fill="#FFFFFF"/>
      <path d="M -5,4 L 5,4 L 3,10 L -3,10 Z" fill="#FFFFFF"/>
      <line x1="0" y1="-24" x2="0" y2="-21" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="-16" y1="-18" x2="-13" y2="-15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <line x1="16" y1="-18" x2="13" y2="-15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Center Navy M Emblem -->
    <!-- Outer M Wings -->
    <path d="M -75,-65 L -45,-65 L 0,10 L 45,-65 L 75,-65 L 75,70 C 75,70 65,75 55,75 C 45,75 45,60 45,60 L 45,-15 L 0,45 L -45,-15 L -45,60 C -45,60 -45,75 -55,75 C -65,75 -75,70 -75,70 Z" fill="#0C2340"/>
    
    <!-- Central Pillars inside M -->
    <rect x="-18" y="-5" width="14" height="75" rx="3" fill="#0C2340"/>
    <rect x="4" y="-5" width="14" height="75" rx="3" fill="#0C2340"/>
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="420" font-family="'Inter', 'Montserrat', 'Helvetica', sans-serif" font-weight="900" font-size="52" fill="#0C2340" text-anchor="middle" letter-spacing="4">MIRAI</text>
  <text x="256" y="455" font-family="'Inter', 'Roboto', 'Helvetica', sans-serif" font-weight="700" font-size="19" fill="#0C2340" text-anchor="middle" letter-spacing="5">SCHOOL OF TECHNOLOGY</text>
  
  <g transform="translate(256, 480)">
    <line x1="-170" y1="0" x2="-100" y2="0" stroke="#0C2340" stroke-width="1.5"/>
    <text x="0" y="4" font-family="'Inter', 'Roboto', sans-serif" font-weight="600" font-size="13" fill="#0C2340" text-anchor="middle" letter-spacing="4">CLUBS MANAGEMENT</text>
    <line x1="100" y1="0" x2="170" y2="0" stroke="#0C2340" stroke-width="1.5"/>
  </g>
</svg>
